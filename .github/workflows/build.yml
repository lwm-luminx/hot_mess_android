name: Build

on:
  push:
    branches: [next, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The app builds against the AudienceKit SDK (its Gradle build is at the repository root) from source (a Gradle composite build). It's public, so
      # no key is needed.
      - uses: actions/checkout@v5
        with:
          repository: lwm-luminx/audience-kit-sdk
          ref: main
          path: audience-kit-sdk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and run unit tests
        run: ./gradlew assembleDebug test
      # Staging is built like Release, through R8, so this catches missing keep rules and missing-class errors.
      - name: Build Staging with R8
        run: ./gradlew assembleStaging

      # Hot Mess talks only to the consumer endpoint (/graphql), never /staffql: managers use Velvet and Backstage.
      - name: No staff endpoint in Hot Mess
        run: |
          if grep -rnE 'GraphQLEndpoint\.STAFF|# endpoint: staff|/staffql' core/src/main app/src/main; then
            echo "::error::Hot Mess must not call the staff endpoint (staffql)."
            exit 1
          fi

      # The app's GraphQL documents (core/ and app/, with the SDK's fragments they interpolate) against
      # graphql/schema.graphql: the API's consumer schema this app is built and tested against (a copy of
      # audience_kit_api's contracts/schema/schema.graphql from its `next`). When the app starts using something new,
      # copy the API's dump in with the change. PRs into `next` and `main` also check that the matching deployed API
      # serves all of that copy (deployed-api.yml).
      - name: GraphQL documents match the schema the app is built against
        run: |
          npm install --silent --no-save --no-package-lock --prefix .graphql-check graphql@16
          cp scripts/graphql/check.mjs .graphql-check/check.mjs
          node .graphql-check/check.mjs --schema graphql/schema.graphql --endpoint consumer \
            core/src/main app/src/main audience-kit-sdk/android/audiencekit/src/main
